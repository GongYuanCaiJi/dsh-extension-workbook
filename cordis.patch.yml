# dsh-extension-workbook bundle layer.
#
# When this package is listed in a profile's dsh.profile.bundles, this patch
# inserts the plugin row into the profile composition. Users override the
# row's whole `config` in their own cordis.patch.yml (later layers win; a
# patch REPLACES the entire config, it does not deep-merge).
- insert:
    - id: workbook
      name: dsh-extension-workbook
      config: {}
